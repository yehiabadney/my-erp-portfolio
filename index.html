<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي الشخصية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #0056b3; }
        p { line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #0056b3;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في صفحتي الشخصية</h1>
        <p>أنا [اكتب اسمك هنا]، أعمل في مجال [مجال عملك/اختصاصك]. أهتم بتقديم أفضل الحلول والخدمات في هذا المجال.</p>
        
        <h2>أبرز المهارات والخدمات</h2>
        <p>إدارة البيانات | إدارة الأنظمة | تطوير الحلول الرقمية</p>

        <a href="mailto:your-email@example.com" class="btn">تواصل معي</a>
    </div>

</body>
</html>
